name: Playwright E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 06:00 UTC: keeps the suite "alive" and catches breakages
    # caused by changes in the target site, even without new commits.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

# Only one Pages deployment at a time; don't cancel one that is in progress.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Quality gate: fails fast on syntax/type errors before spending
      # minutes installing browsers and running the suite.
      - name: Type-check
        run: |
          npm install --no-save @types/node@24
          npm run typecheck

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  publish-report:
    needs: test
    # Publish on main (push, schedule, manual run) even when tests fail,
    # so the report shows what broke. Never on pull requests.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # deploy-pages requires the job to target the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: playwright-report

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
